[package]
name = "merge-safetensors"
version = "0.2.2"
edition = "2021"
description = "Merge sharded .safetensors files into one, driven by a *.safetensors.index.json"
repository = "https://github.com/apiplant/merge-safetensors-rs"
readme = "README.md"
keywords = ["safetensors","merge","shards","machine-learning"]
categories = ["science","command-line-utilities"]
exclude = ["/packaging/","/.github/"]
license = "MIT"

[lib]
name = "merge_safetensors"
path = "src/lib.rs"

[[bin]]
name = "merge-safetensors"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.4"
anyhow = "1"
rayon = "1"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
